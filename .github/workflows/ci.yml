name: PRAMAAN CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Lint, Security & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Synthetic Fixture & CA Generation Check
        run: |
          python data/generate.py

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: sqlite:///./storage/test_ci.db
          JWT_SECRET: test_ci_secret_key_minimum_32_bytes_long!
          PORTAL_ADAPTER: mock
          LLM_PROVIDER: offline
        run: |
          cd backend
          pytest -v --cov=app --cov-report=xml

  frontend-test:
    name: Frontend Lint & Vitest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Vitest Component Tests
        working-directory: ./frontend
        run: npm test -- --run

      - name: Build Frontend Production Artifact
        working-directory: ./frontend
        run: npm run build
